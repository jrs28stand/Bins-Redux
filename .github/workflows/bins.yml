name: Bin reminder

on:
  schedule:
    # Times are UTC, so an hour later in UK summer time. GitHub can delay runs.
    # Both runs alert for tomorrow's bins, giving two reminders the day before.
    # Morning: 07:38 in winter, 08:38 in summer.
    - cron: "38 7 * * *"
    # Evening: 18:45 in winter, 19:45 in summer.
    - cron: "45 18 * * *"
  # Adds a "Run workflow" button. Manual runs send a test alert.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # actions/checkout v4.4.0, pinned to its exact commit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check bins
        env:
          BINS_UPRN: ${{ secrets.BINS_UPRN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && '--test' || '' }}
        run: python3 bins.py $MODE
